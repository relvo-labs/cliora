# The baseline gate every push must pass, for all three languages. It was named
# `p0.yml` because P0 created it, but it has never been P0-specific — the
# phase-specific workflows (p1/p2/p3, and p4 to come) add scenarios on top of this
# one. Renamed in P4-07 so the file says what it is, since a file called `p0.yml`
# looks like something the P0 retirement should have deleted.
name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.11.31" }
      - uses: actions/setup-python@v5
        with: { python-version-file: ".python-version" }
      - run: uv sync --project backend --locked
      - run: uv run --project backend ruff format --check backend
      - run: uv run --project backend ruff check backend
      - run: uv run --project backend mypy backend/app
      - run: uv run --project backend pytest backend/tests -q
  daemon:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with: { go-version-file: ".go-version", cache-dependency-path: "daemon/go.sum" }
      - run: test -z "$(gofmt -l .)"
        working-directory: daemon
      - run: go vet ./...
        working-directory: daemon
      - run: go test -race ./...
        working-directory: daemon
      - run: go build ./cmd/agentd ./cmd/fakecli
        working-directory: daemon
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: ".nvmrc", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: npm run format:check && npm run lint && npm run typecheck && npm run test:unit -- --run && npm run build
        working-directory: frontend
  tmux-integration:
    runs-on: ubuntu-24.04
    needs: [backend, daemon, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - uses: actions/setup-go@v6
        with: { go-version-file: ".go-version" }
      - run: go test -tags integration -race ./...
        working-directory: daemon
  e2e:
    runs-on: ubuntu-24.04
    needs: frontend
    strategy: { fail-fast: false, matrix: { browser: [chromium, firefox, webkit] } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: ".nvmrc", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps ${{ matrix.browser }}
        working-directory: frontend
      - run: npx playwright test --project=${{ matrix.browser }}
        working-directory: frontend
