# The baseline gate every push must pass, for all three languages. It was named
# `p0.yml` because P0 created it, but it has never been P0-specific — the
# phase-specific workflows (p1/p2/p3, and p4 to come) add scenarios on top of this
# one. Renamed in P4-07 so the file says what it is, since a file called `p0.yml`
# looks like something the P0 retirement should have deleted.
name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.11.31" }
      - uses: actions/setup-python@v5
        with: { python-version-file: ".python-version" }
      - run: uv sync --project backend --locked
      - run: uv run --project backend ruff format --check backend
      - run: uv run --project backend ruff check backend
      - run: uv run --project backend mypy backend/app
      - run: uv run --project backend pytest backend/tests -q
  daemon:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with: { go-version-file: ".go-version", cache-dependency-path: "daemon/go.sum" }
      - run: test -z "$(gofmt -l .)"
        working-directory: daemon
      - run: go vet ./...
        working-directory: daemon
      - run: go test -race ./...
        working-directory: daemon
      - run: go build ./cmd/agentd ./cmd/fakecli
        working-directory: daemon
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: ".nvmrc", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: npm run format:check && npm run lint && npm run typecheck && npm run test:unit -- --run && npm run build
        working-directory: frontend
  # Deployment configuration, checked without a platform account. It belongs in the baseline
  # gate rather than a phase workflow because the two edge
  # configurations can be made to disagree by a change to either one of them, and the
  # disagreement is invisible until whichever deployment nobody tested is the one in use.
  deploy-config:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.11.31" }
      - uses: actions/setup-python@v5
        with: { python-version-file: ".python-version" }
      - run: uv sync --project backend --locked
      - run: make railway-check
      # The rendered Railway edge config must be a config nginx accepts. `nginx -t` on the
      # real image is the cheapest possible version of "execute it, do not read it" — the
      # over-the-wire assertions need a deployment and live in
      # scripts/railway/verify-deployment.sh.
      - name: nginx accepts the rendered Railway template
        run: |
          mkdir -p /tmp/edge-html
          echo '<!doctype html><title>x</title>' > /tmp/edge-html/index.html
          docker run --rm \
            -v "$PWD/deploy/railway/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro" \
            -v /tmp/edge-html:/usr/share/nginx/html:ro \
            -e NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx \
            -e NGINX_ENTRYPOINT_LOCAL_RESOLVERS=1 \
            -e PORT=8080 \
            -e CLIORA_BACKEND_HOST=central.railway.internal \
            -e CLIORA_BACKEND_PORT=8080 \
            nginx:1.27-alpine sh -c '/docker-entrypoint.sh nginx -t'
      # Same rule applied to Central's image: execute it, do not read it. `uv sync` writes an
      # absolute shebang into every console script, so a venv assembled at a staging path and
      # copied elsewhere leaves `alembic` and `uvicorn` pointing at an interpreter the runtime
      # image does not contain. The exec failure then names the *script* as missing rather
      # than the interpreter, which is as misleading as container errors get.
      #
      # This is here because nothing else in CI builds this image: the e2e stack runs uvicorn
      # from source (scripts/e2e/run-stack.sh), so the first process ever to exec the image
      # was a real deployment. The three commands below are exactly the three invocations the
      # two deployments use — central.railway.json's start and pre-deploy commands, compose's
      # migrate entrypoint, and the create-admin step in both runbooks.
      - name: the Central image can exec what the deployments invoke
        run: |
          docker build -f deploy/backend.Dockerfile -t cliora-central .
          docker run --rm --entrypoint alembic cliora-central --version
          docker run --rm --entrypoint sh cliora-central -c 'exec uvicorn --version'
          docker run --rm --entrypoint python cliora-central -m app.bootstrap --help >/dev/null
          # Importing the application is a separate assertion, not a redundant one: the
          # checks above exec the venv's scripts without ever loading `app`, so an image
          # missing a file the app reads at import time passes all three and then dies on
          # first start. `app/protocol/codec.py` reads its JSON Schema at import, which is
          # exactly how a missing contracts/ turned into an unexplained health-check
          # timeout. No database is touched: the engine connects lazily.
          docker run --rm --entrypoint python cliora-central -c 'import app.main'

  tmux-integration:
    runs-on: ubuntu-24.04
    needs: [backend, daemon, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - uses: actions/setup-go@v6
        with: { go-version-file: ".go-version" }
      - run: go test -tags integration -race ./...
        working-directory: daemon
  e2e:
    runs-on: ubuntu-24.04
    needs: frontend
    strategy: { fail-fast: false, matrix: { browser: [chromium, firefox, webkit] } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: ".nvmrc", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps ${{ matrix.browser }}
        working-directory: frontend
      - run: npx playwright test --project=${{ matrix.browser }}
        working-directory: frontend
