name: Requirement Traceability

on:
  # Manual re-run of the whole gate, for a draft PR or a branch with no PR open.
  workflow_dispatch:
  # Ready-for-review PRs only: `ready_for_review` catches the moment a draft is
  # promoted, the other three cover a PR that was never a draft. Drafts still emit
  # `opened`/`synchronize`, so every job below carries the draft guard as well.
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

jobs:
  static:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.11.31" }
      - uses: actions/setup-python@v5
        with: { python-version-file: ".python-version" }
      - run: uv sync --project backend --locked
      # Full release blocking (ADR 0019 stage 7): every active criterion must have
      # its required links, and none may be awaiting a requirement rewrite. The
      # baseline-debt allowlist is empty and is checked in both directions, so an
      # entry cannot be added back without stepping the rollout down on purpose.
      - name: Schema, anchors, links, selectors, generated views and coverage
        run: make traceability
      - name: Coverage report
        if: always()
        run: scripts/trace coverage --scope all --format json > traceability-coverage-report.json
      - name: Machine-readable static report
        if: always()
        run: scripts/trace validate --level static --format json > traceability-static.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: traceability-static
          path: |
            traceability-static.json
            traceability-coverage-report.json

  impact:
    if: (github.event_name == 'pull_request') && (github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.11.31" }
      - uses: actions/setup-python@v5
        with: { python-version-file: ".python-version" }
      - run: uv sync --project backend --locked
      - name: Changed-scope impact
        run: |
          scripts/trace impact \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.sha }}" \
            --format json | tee traceability-impact.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: traceability-impact
          path: traceability-impact.json
