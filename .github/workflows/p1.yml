name: P1
on: [push, pull_request]
jobs:
  # Backend against a real PostgreSQL: migrations (up/down/up) then the full
  # suite including the DB-backed auth/RBAC/enrollment/node/status/audit tests.
  backend-db:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: cliora, POSTGRES_PASSWORD: cliora, POSTGRES_DB: cliora_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cliora" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      CLIORA_DATABASE_URL: postgresql+asyncpg://cliora:cliora@127.0.0.1:5432/cliora_test
      CLIORA_TEST_DATABASE_URL: postgresql+asyncpg://cliora:cliora@127.0.0.1:5432/cliora_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.11.31" }
      - uses: actions/setup-python@v5
        with: { python-version-file: ".python-version" }
      - run: uv sync --project backend --locked
      - name: migrations up / down / up
        working-directory: backend
        env: { CLIORA_ADMIN_PASSWORD: ci-admin-pw }
        run: |
          uv run --project . alembic upgrade head
          uv run --project . python -m app.bootstrap create-admin --username migration-rollback
          uv run --project . alembic downgrade base
          uv run --project . alembic upgrade head
      - name: bootstrap the first admin
        working-directory: backend
        env: { CLIORA_ADMIN_PASSWORD: ci-admin-pw }
        run: uv run --project . python -m app.bootstrap create-admin --username admin
      - name: unit + DB-backed tests
        run: uv run --project backend pytest backend/tests -q

  # Cross-architecture daemon build with checksums (the release artifact shape).
  daemon-artifacts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with: { go-version-file: ".go-version", cache-dependency-path: "daemon/go.sum" }
      - working-directory: daemon
        run: |
          go vet ./...
          go test -race ./...
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch go build -o "dist/agentd_linux_$arch" ./cmd/agentd
          done
          (cd dist && sha256sum agentd_linux_* > checksums.txt && cat checksums.txt)
      - uses: actions/upload-artifact@v4
        with: { name: agentd-binaries, path: daemon/dist/ }

  # Installer contract that runs without root/systemd: download → SHA256 verify →
  # extract → run. The full OS install-matrix (Ubuntu 22.04/24.04, Debian 12 ×
  # amd64/arm64: install → start → restart re-register → doctor → uninstall) needs
  # real systemd + a backend and runs as a release gate on VM runners — see
  # docs/p1-report.md.
  install-smoke:
    runs-on: ubuntu-24.04
    needs: daemon-artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: agentd-binaries, path: dist }
      - name: package + verify + extract like install.sh
        run: |
          set -euo pipefail
          # upload-artifact intentionally does not preserve Unix mode bits.
          chmod +x dist/agentd_linux_amd64
          mkdir -p srv/api/downloads
          tar -C dist --transform 's#agentd_linux_amd64#agentd#' -czf srv/api/downloads/agentd_0.0.0_linux_amd64.tar.gz agentd_linux_amd64
          sha=$(sha256sum srv/api/downloads/agentd_0.0.0_linux_amd64.tar.gz | awk '{print $1}')
          printf '%s  agentd_0.0.0_linux_amd64.tar.gz\n' "$sha" > srv/api/downloads/checksums.txt
          (cd srv && python3 -m http.server 8199 &) ; sleep 1
          line=$(curl -fsSL http://127.0.0.1:8199/api/downloads/checksums.txt)
          file=$(echo "$line" | awk '{print $2}')
          curl -fsSL "http://127.0.0.1:8199/api/downloads/$file" -o "$file"
          echo "$line" | sed "s#\$#  $file#" >/dev/null
          echo "$sha  $file" | sha256sum -c -
          tar -xzf "$file"
          ./agentd version

  # Security-focused checks: the auth/enrollment/credential/ws test paths plus a
  # scan that no secret material leaks into logs/artifacts.
  security:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: cliora, POSTGRES_PASSWORD: cliora, POSTGRES_DB: cliora_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cliora" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      CLIORA_DATABASE_URL: postgresql+asyncpg://cliora:cliora@127.0.0.1:5432/cliora_test
      CLIORA_TEST_DATABASE_URL: postgresql+asyncpg://cliora:cliora@127.0.0.1:5432/cliora_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.11.31" }
      - uses: actions/setup-python@v5
        with: { python-version-file: ".python-version" }
      - run: uv sync --project backend --locked
      - working-directory: backend
        run: uv run --project . alembic upgrade head
      - name: auth / enrollment / credential / ws paths
        run: uv run --project backend pytest backend/tests/db backend/tests/test_security.py -q


  # Canonical release build via GoReleaser, gated to version tags (v*) so it
  # never runs on PRs or branch pushes. Produces agentd_<ver>_linux_{amd64,arm64}
  # .tar.gz + checksums.txt from daemon/.goreleaser.yaml — the same artifact shape
  # daemon-artifacts builds by hand. release.disable is true in that config, so no
  # GitHub release is published and no GITHUB_TOKEN is required.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v6
        with: { go-version-file: ".go-version", cache-dependency-path: "daemon/go.sum" }
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
          workdir: daemon
      - uses: actions/upload-artifact@v4
        with: { name: agentd-release, path: daemon/dist/ }

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm run test:unit -- --run
          npm run build

  browser-e2e:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: cliora, POSTGRES_PASSWORD: cliora, POSTGRES_DB: cliora_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cliora" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      CLIORA_DATABASE_URL: postgresql+asyncpg://cliora:cliora@127.0.0.1:5432/cliora_test
      E2E_FULL_STACK: "1"
      E2E_ADMIN_USER: e2e-admin
      E2E_ADMIN_PASSWORD: e2e-admin-pw
      CLIORA_ADMIN_PASSWORD: e2e-admin-pw
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.11.31" }
      - uses: actions/setup-python@v5
        with: { python-version-file: ".python-version" }
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: generate a throwaway encryption key for the E2E database
        run: |
          python -c "import base64,secrets; print('CLIORA_SECRET_ENCRYPTION_KEY=' + base64.b64encode(secrets.token_bytes(32)).decode())" >> "$GITHUB_ENV"
      - run: uv sync --project backend --locked
      - working-directory: backend
        run: |
          uv run --project . alembic upgrade head
          uv run --project . python -m app.bootstrap create-admin --username "$E2E_ADMIN_USER"
          uv run --project . uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/cliora-central.log 2>&1 &
          for attempt in {1..30}; do curl -fsS http://127.0.0.1:8000/readyz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/readyz
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx playwright install --with-deps chromium firefox webkit
      - working-directory: frontend
        run: npm run test:e2e
