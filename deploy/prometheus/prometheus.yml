# Prometheus for the compose `observability` profile (P4-12).
#
# Central is scraped over the internal network only; /api/metrics is not exposed at the
# edge (see deploy/nginx/nginx.conf). The bearer token is the dedicated scrape token, not
# a user session: Prometheus holds no session, and reusing `audit.view` would mean
# creating a service account that can read the audit trail in order to read numbers
# (ADR 0018).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: cliora-central
    metrics_path: /api/metrics
    static_configs:
      - targets: ["backend:8000"]
    authorization:
      type: Bearer
      # Mounted as a file rather than inlined so the token is not committed and not
      # visible in the Prometheus config UI.
      credentials_file: /etc/prometheus/scrape-token
