# Cliora edge configuration (P4-12, tech §23 #1).
#
# Four things here are load-bearing and easy to get wrong. Each is commented at the
# directive, but in summary:
#
#   * `proxy_read_timeout` on /ws must stay above uvicorn's WebSocket ping interval.
#     Not "above human idle time" — that was this file's original reasoning and it was
#     wrong: uvicorn pings every 20 s by default and each ping resets the timeout, so an
#     idle terminal survives nginx's 60 s default just fine. The failure mode is narrower
#     and nastier: raise `ws_ping_interval` (or lower this) so the ping interval exceeds
#     this timeout and *every* WebSocket dies on a fixed cycle regardless of activity.
#   * body/frame limits aligned with the 8 MiB filesystem contract. A limit below it
#     turns a legal file read into a 413 from a component that knows nothing about the
#     protocol.
#   * CSP with no external origins, plus `worker-src blob:` for Monaco. Monaco loads its
#     language workers from blob URLs; without that clause the editor is blank with only
#     a console error to show for it.
#   * HTTP is redirected, never served. TLS termination is here, and `/api` and `/ws`
#     both go to the same backend so a browser needs no second origin.
#
# The CSP is one very long line on purpose. **nginx has no line continuation inside a
# quoted string**: a trailing `\` puts a literal backslash and newline *into the header
# value*. The result is an invalid HTTP/2 header — curl rejects the whole response with
# error 92, and a browser does the same, so the page breaks and the policy is not applied
# either. It read as a tidy multi-line policy and was neither. Do not re-wrap it.
#
# One further nginx semantic dominates how this file is written: **`add_header` does not inherit
# into a location that declares its own `add_header`.** The whole server-level set is
# silently discarded there. `location /` and `location /assets/` both set `Cache-Control`,
# so for a while every security header — HSTS, CSP, X-Frame-Options — was absent on the
# HTML page and the JS bundle, i.e. on exactly the responses that need them, while the
# config read as though they were present. That is why the set is repeated per location
# below instead of being declared once, and why `scripts/p4/verify-edge.sh` asserts the
# headers over the wire rather than by reading this file.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;  # 500 terminal WS (NFR-003) plus HTTP, with headroom
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # `$request_id` is nginx's own; Central generates its own correlation id and returns
    # it in the error body. Both are logged so an edge log line can be joined to a
    # Central log line during an incident.
    log_format cliora '$remote_addr - $status "$request" '
                      'rt=$request_time up=$upstream_response_time '
                      'nginx_req_id=$request_id';
    access_log /var/log/nginx/access.log cliora;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;      # terminal frames are small and latency-sensitive (NFR-001)
    server_tokens off;   # the version is not information a client needs

    keepalive_timeout 65;
    client_max_body_size 16m;   # >= the 8 MiB filesystem contract, matching uvicorn
    large_client_header_buffers 4 16k;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    # Terminal traffic is a WebSocket, so gzip never touches it. Stated because
    # compressing an interactive stream would add latency for no size win.

    upstream cliora_backend {
        server backend:8000;
        keepalive 32;
    }

    # --- HTTP: redirect only ---
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # ACME stays on plain HTTP; everything else is redirected. Without this
        # exception a certificate renewal cannot complete on a host that has just
        # started serving HTTPS-only.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --- HTTPS ---
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name _;

        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;  # TLS 1.3 makes server preference counterproductive
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;

        # 1 year, subdomains included. Not preloaded by default: preload is effectively
        # irreversible for the domain, so it is an explicit decision for the operator to
        # add rather than something a config ships switched on.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        # Cliora renders a live terminal for authenticated users; embedding it in
        # another site's frame has no legitimate use and every clickjacking one.
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # No external origin appears anywhere in this policy — that is the point, and it
        # is what P4-07 made possible by removing the last CDN font import. If a CDN
        # reference ever comes back, the page breaks here rather than quietly reaching
        # out to a third party from an operator's browser.
        #
        # `worker-src 'self' blob:` is required by Monaco, which instantiates its
        # language workers from blob URLs. `wasm-unsafe-eval` covers Monaco's WASM
        # tokenizer paths. `'unsafe-inline'` for styles only: Vue scopes component
        # styles by injecting <style> elements, and there is no build-time nonce for
        # them; script has no such allowance.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; child-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' wss: ws:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

        # --- WebSocket: terminals and daemons ---
        location /ws/ {
            proxy_pass http://cliora_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Must exceed uvicorn's `ws_ping_interval` (default 20 s). Those server pings
            # are what keep this timeout from expiring on an otherwise idle terminal —
            # so the number here is not "how long a human might pause" but "comfortably
            # more than the keepalive". 1 h leaves room to raise the ping interval later
            # without silently arming a fixed-cycle disconnect.
            #
            # `scripts/p4/verify-edge.sh` asserts this over the wire, with the server ping
            # pushed out of the way so the proxy is the only thing that can close the
            # connection. Without that, the check passes at `proxy_read_timeout 20s`.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;   # a buffered terminal is a laggy terminal
            proxy_cache off;
        }

        # --- API ---
        location /api/ {
            proxy_pass http://cliora_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Longer than the daemon-update relay budget (180 s, ADR 0017), which is the
            # slowest legitimate request Central makes. A shorter value here would turn
            # a successful update into an edge timeout.
            proxy_read_timeout 240s;
            proxy_buffering on;
        }

        # Probes are proxied but never logged: a health check every second would drown
        # the access log it shares with real requests.
        location = /healthz {
            proxy_pass http://cliora_backend;
            access_log off;
        }
        location = /readyz {
            proxy_pass http://cliora_backend;
            access_log off;
        }

        # `/api/metrics` is refused at the edge. It is off by default, and when enabled it
        # belongs on an internal listener reachable only by the scraper (the compose
        # `observability` profile does exactly that) — publishing it here would make the
        # whole series set reachable by anyone who can reach the host, token or not.
        #
        # This block has to exist. `location /api/` is a prefix match and would otherwise
        # proxy `/api/metrics` straight through: for a while this file carried a comment
        # claiming the endpoint was "deliberately not exposed here" while the config
        # cheerfully exposed it. A comment is not a rule. `location = ` is an exact match
        # and takes priority over the prefix, so this is the rule.
        location = /api/metrics {
            return 404;
        }

        # --- Static console ---
        root /usr/share/nginx/html;
        index index.html;

        # Content-hashed assets: immutable, cached hard. index.html is not hashed, so it
        # must never be cached — otherwise a browser keeps loading an old bundle that
        # references assets a deploy has already removed.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            # Repeated, not inherited: see the note at the top of this file. Editing this
            # set means editing every copy — the edge verification script fails if one
            # copy drifts.
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Frame-Options "DENY" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; child-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' wss: ws:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
            try_files $uri =404;
        }

        location / {
            add_header Cache-Control "no-store" always;
            # Repeated, not inherited: see the note at the top of this file. Editing this
            # set means editing every copy — the edge verification script fails if one
            # copy drifts.
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Frame-Options "DENY" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; child-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' wss: ws:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
            try_files $uri $uri/ /index.html;
        }
    }
}
