[project]
name = "cliora-central"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.133.0",
  "starlette>=1.3.1,<2",
  "jsonschema==4.25.0",
  "referencing==0.37.0",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "uvicorn[standard]==0.35.0",
  "sqlalchemy[asyncio]==2.0.36",
  "asyncpg==0.30.0",
  "alembic==1.14.0",
  "argon2-cffi==23.1.0",
  "pyjwt==2.13.0",
  "cryptography>=50.0.0,<51",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "mypy==1.17.1",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "ruff==0.12.7",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["backend"]

[tool.ruff]
target-version = "py312"
line-length = 100
# Alembic scripts follow the upstream template (Union imports, numeric module
# names); they are excluded from both ruff and mypy.
extend-exclude = ["app/db/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are intentionally used as argument
# defaults; they are effectively immutable factory calls.
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Header",
  "fastapi.Query",
  "fastapi.Path",
  "fastapi.Body",
  # RBAC guard factory: builds one shared dependency at definition time.
  "app.api.http.deps.require_action",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
# Alembic migration scripts are generated-style code with numeric module names;
# they run against a live DB in CI, not the type checker.
exclude = ["app/db/migrations/"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true
