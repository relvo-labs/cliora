[project]
name = "cliora-central"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.120.1",
  # Imported directly by `api/middleware.py`, so it is declared directly. It arrives
  # with FastAPI either way — but a package you import is a package you depend on, and
  # relying on somebody else's transitive dependency means their next release decides
  # whether your process starts. Unpinned so FastAPI's own constraint stays the
  # authority on which version is compatible.
  "starlette",
  "jsonschema==4.25.0",
  "referencing==0.37.0",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "uvicorn[standard]==0.35.0",
  "sqlalchemy[asyncio]==2.0.36",
  "asyncpg==0.30.0",
  "alembic==1.14.0",
  "argon2-cffi==23.1.0",
  "pyjwt==2.10.1",
  "cryptography>=48.0.1,<49",
  # Multipart form parsing, for artifact upload only (ADR 0030 Part B). The one new
  # runtime dependency this phase adds, and it is Starlette's own recommended parser
  # rather than a hand-rolled one: multipart is a format with a long history of parser
  # bugs, and writing a fourth is not a saving.
  "python-multipart==0.0.20",
  # Outbound HTTP, for opening a pull request and nothing else (V2.4, ADR 0033 §3).
  # **It moved here from the dev group in this phase, and that move is the whole
  # deployment story**: `deploy/backend.Dockerfile` installs with `--no-dev`, so a
  # module importing a dev dependency at import time starts fine in development and
  # cannot start at all in production. `test_runtime_imports_are_declared_dependencies`
  # is what turns that into a failed build rather than a failed boot.
  #
  # Reachable from exactly one module (`services/providers.py`) — the narrowed SCOPE-013
  # asserts that, and it is why a client library being a runtime dependency does not
  # make Central a proxy.
  "httpx==0.28.1",
]

[dependency-groups]
dev = [
  "mypy==1.17.1",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "ruff==0.12.7",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["backend"]

[tool.ruff]
target-version = "py312"
line-length = 100
# Alembic scripts follow the upstream template (Union imports, numeric module
# names); they are excluded from both ruff and mypy.
extend-exclude = ["app/db/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are intentionally used as argument
# defaults; they are effectively immutable factory calls.
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Header",
  "fastapi.Query",
  "fastapi.Path",
  "fastapi.Body",
  # RBAC guard factory: builds one shared dependency at definition time.
  "app.api.http.deps.require_action",
  # Its agent-side counterpart (ADR 0028). Listed separately rather than by a
  # wildcard: the point of this allowlist is that adding a factory here is a
  # decision someone made, not a pattern that quietly grows.
  "app.api.http.deps.require_agent_action",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
# Alembic migration scripts are generated-style code with numeric module names;
# they run against a live DB in CI, not the type checker.
exclude = ["app/db/migrations/"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true
