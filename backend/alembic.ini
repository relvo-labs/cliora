# Alembic configuration for the Cliora Central data layer (ADR 0009).
# Run from the backend/ directory: `uv run --project backend alembic upgrade head`.
[alembic]
script_location = app/db/migrations
prepend_sys_path = .
path_separator = os
# The database URL is resolved from CLIORA_DATABASE_URL in env.py, not here,
# so credentials never live in a committed file.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
